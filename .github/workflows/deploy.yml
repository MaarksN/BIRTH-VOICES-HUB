name: Deploy to Google Cloud Run

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: birthvoices-app
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: birthvoices-repo
  IMAGE_NAME: birthvoices-app
  TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Migrate, Build & Deploy to Cloud Run
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify required production configuration
        shell: bash
        run: |
          missing=()
          [ -z "${{ secrets.GCP_PROJECT_ID }}" ] && missing+=("GCP_PROJECT_ID")
          [ -z "${{ secrets.GCP_SA_KEY }}${{ secrets.GCP_CREDENTIALS }}" ] && missing+=("GCP_SA_KEY (or GCP_CREDENTIALS)")
          [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ] && missing+=("PRODUCTION_DATABASE_URL")
          [ -z "${{ secrets.PRODUCTION_REDIS_URL }}" ] && missing+=("PRODUCTION_REDIS_URL")
          [ -z "${{ secrets.JWT_SECRET }}" ] && missing+=("JWT_SECRET")
          [ -z "${{ secrets.REFRESH_TOKEN_SECRET }}" ] && missing+=("REFRESH_TOKEN_SECRET")
          [ -z "${{ secrets.GEMINI_API_KEY }}" ] && missing+=("GEMINI_API_KEY")
          [ -z "${{ secrets.TWILIO_ACCOUNT_SID }}" ] && missing+=("TWILIO_ACCOUNT_SID")
          [ -z "${{ secrets.TWILIO_AUTH_TOKEN }}" ] && missing+=("TWILIO_AUTH_TOKEN")
          [ -z "${{ secrets.TWILIO_FROM_NUMBER }}" ] && missing+=("TWILIO_FROM_NUMBER")
          [ -z "${{ secrets.WEBHOOK_SIGNING_SECRET }}" ] && missing+=("WEBHOOK_SIGNING_SECRET")
          [ -z "${{ vars.PUBLIC_BASE_URL }}" ] && missing+=("PUBLIC_BASE_URL (production environment variable)")
          [ -z "${{ vars.ALLOWED_ORIGINS }}" ] && missing+=("ALLOWED_ORIGINS (production environment variable)")

          # AtlasGR/Bland is optional for the core Twilio product, but partial configuration is
          # unsafe: callbacks, consent and CRM forwarding depend on the whole set. If any switch in
          # this block is present, require every field before promotion.
          atlasgr_requested="${{ secrets.BLAND_API_KEY }}${{ secrets.BLAND_WEBHOOK_TOKEN }}${{ secrets.ATLASGR_WEBHOOK_SECRET }}${{ vars.ATLASGR_TENANT_ID }}${{ vars.ATLASGR_BASE_URL }}"
          if [ -n "$atlasgr_requested" ]; then
            [ -z "${{ secrets.BLAND_API_KEY }}" ] && missing+=("BLAND_API_KEY")
            [ -z "${{ secrets.BLAND_WEBHOOK_TOKEN }}" ] && missing+=("BLAND_WEBHOOK_TOKEN")
            [ -z "${{ secrets.ATLASGR_WEBHOOK_SECRET }}" ] && missing+=("ATLASGR_WEBHOOK_SECRET")
            [ -z "${{ vars.ATLASGR_TENANT_ID }}" ] && missing+=("ATLASGR_TENANT_ID (production environment variable)")
            [ -z "${{ vars.ATLASGR_BASE_URL }}" ] && missing+=("ATLASGR_BASE_URL (production environment variable)")
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::Missing required production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Build and push immutable Docker image
        run: |
          IMAGE_PATH="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_SHA }}"
          docker build -t "$IMAGE_PATH" .
          docker push "$IMAGE_PATH"

      - name: Apply production database migrations
        run: |
          IMAGE_PATH="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_SHA }}"
          docker run --rm \
            -e DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}" \
            "$IMAGE_PATH" npx prisma migrate deploy

      - name: Deploy tested image to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_SHA }}
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
            REDIS_URL=${{ secrets.PRODUCTION_REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=${{ vars.GEMINI_MODEL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}
            DEFAULT_AGENT_ID=${{ vars.DEFAULT_AGENT_ID }}
            WEBHOOK_URL=${{ vars.WEBHOOK_URL }}
            WEBHOOK_SIGNING_SECRET=${{ secrets.WEBHOOK_SIGNING_SECRET }}
            BLAND_API_KEY=${{ secrets.BLAND_API_KEY }}
            BLAND_WEBHOOK_TOKEN=${{ secrets.BLAND_WEBHOOK_TOKEN }}
            BLAND_RECORD_CALLS=${{ vars.BLAND_RECORD_CALLS }}
            WEBHOOK_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            ATLASGR_TENANT_ID=${{ vars.ATLASGR_TENANT_ID }}
            ATLASGR_BASE_URL=${{ vars.ATLASGR_BASE_URL }}
            ATLASGR_WEBHOOK_SECRET=${{ secrets.ATLASGR_WEBHOOK_SECRET }}
            ATLASGR_WEBHOOK_IDEMPOTENCY_TTL_SECONDS=${{ vars.ATLASGR_WEBHOOK_IDEMPOTENCY_TTL_SECONDS }}
            OIDC_ISSUER=${{ vars.OIDC_ISSUER }}
            OIDC_CLIENT_ID=${{ vars.OIDC_CLIENT_ID }}
            OIDC_CLIENT_SECRET=${{ secrets.OIDC_CLIENT_SECRET }}
            OTEL_SERVICE_NAME=${{ vars.OTEL_SERVICE_NAME }}
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Show deployed service URL
        run: echo "Service URL => ${{ steps.deploy.outputs.url }}"

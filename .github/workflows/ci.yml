name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  # Fixed values for the ephemeral CI database/cache — these are not read from
  # repository secrets; CI never talks to production infrastructure.
  DATABASE_URL: "postgresql://devuser:devpassword@localhost:5432/birthvoices"
  REDIS_URL: "redis://localhost:6379"
  ALLOWED_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"
  JWT_SECRET: "ci_jwt_secret_do_not_use_in_production"
  REFRESH_TOKEN_SECRET: "ci_refresh_secret_do_not_use_in_production"
  NODE_ENV: "test"

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: birthvoices
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Runtime Dependency Audit
      # Audit the same root runtime dependency set copied into the Cloud Run image. Experimental
      # workspaces such as packages/sip-agent are not shipped by the production Docker stage.
      run: npm audit --omit=dev --workspaces=false --audit-level=high

    - name: Prisma Generate
      run: npx prisma generate

    - name: Prisma Migrate Check
      run: npx prisma migrate deploy

    - name: Prisma Seed
      run: npx prisma db seed

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Run Tests
      run: npm run test

    - name: Build Application
      run: npm run build

    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium

    - name: Browser Smoke Tests
      run: npm run test:e2e

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore

  docker-build:
    name: Docker Build Artifact
    runs-on: ubuntu-latest
    needs: validate-and-build
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Build Docker Image
      run: docker build -t birthvoices-app:${{ github.sha }} .

openapi: 3.1.0
info:
  title: Birth Voices Hub API
  description: Enterprise API for managing multi-tenant workflows, AI agents, and voice interactions.
  version: 1.0.0
servers:
  - url: http://localhost:5001/api
    description: Local Development Server
  - url: https://api.birthvoiceshub.com/api
    description: Production Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        companyName:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Workflow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        nodes:
          type: array
        edges:
          type: array

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        model:
          type: string
        configuration:
          type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: User Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /workflows:
    get:
      summary: List Workflows
      responses:
        '200':
          description: A list of workflows for the current tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      summary: Create a Workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'

  /agents:
    get:
      summary: List Agents
      responses:
        '200':
          description: List of AI agents for the current tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      summary: Create an Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, model]
              properties:
                name:
                  type: string
                model:
                  type: string
                configuration:
                  type: object
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

  /voice/outbound:
    post:
      summary: Place an Outbound Voice Call
      description: >
        Asks the telephony provider to dial `targetNumber` and hand the answered call to the given
        agent. Returns as soon as the call is queued — the conversation and its result happen
        afterwards, and the outcome is delivered via the `agent.call.ended` webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, targetNumber]
              properties:
                agentId:
                  type: string
                  format: uuid
                targetNumber:
                  type: string
                  description: Destination number in E.164 format.
                  example: '+5511999998888'
                context:
                  type: object
                  description: >
                    Free-form facts about who is being called. Values are available as
                    `{{placeholder}}` substitutions in the agent's `outboundGreeting` and are
                    echoed back on the `agent.call.ended` webhook for correlation.
                  example:
                    name: João
                    company: Transportadora X
                    leadId: ckv1234
                callbackUrl:
                  type: string
                  format: uri
                  description: >
                    Per-call destination for the `agent.call.ended` webhook, overriding the
                    deployment-wide `WEBHOOK_URL`. Must be HTTPS outside development.
      responses:
        '202':
          description: Call accepted by the telephony provider and queued for dialing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessionId:
                    type: string
                    description: Correlates this call with the `agent.call.ended` webhook.
                  callSid:
                    type: string
                  status:
                    type: string
                    example: queued
        '400':
          description: Invalid payload (e.g. `targetNumber` is not E.164).
        '404':
          description: No such agent for the authenticated tenant.
        '409':
          description: A call to this number is already in progress for this tenant.
        '502':
          description: The telephony provider rejected the call.
        '503':
          description: Outbound calling is not configured on this deployment.

  /health:
    get:
      summary: Health Check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  redis:
                    type: string
                    example: connected

  /telephony/inbound:
    post:
      summary: Twilio Inbound Webhook
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: TwiML response

  /metrics:
    get:
      summary: Get system metrics
      responses:
        '200':
          description: Returns platform metrics (calls, tokens, etc)
          content:
            application/json:
              schema:
                type: object
